<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Medical Record - Thavakalthu Farm</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Poppins', sans-serif;
    min-height:100vh;
    background: linear-gradient(135deg, #0f2f18, #2e7d32);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

/* Floating logo */
.logo-corner {
    position: fixed;
    top: 30px;
    left: 30px;
    background: rgba(255,255,255,0.92);
    padding: 12px 16px;
    border-radius: 28px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
}

.logo-corner img {
    width: 130px;
    border-radius: 18px;
}

/* Card */
.card {
    width: 520px;
    max-width: 100%;
    background: white;
    padding: 50px;
    border-radius: 28px;
    box-shadow:
        0 30px 60px rgba(0,0,0,0.15),
        0 15px 30px rgba(0,0,0,0.08);
}

.card h2 {
    text-align:center;
    font-size:28px;
    font-weight:700;
    color:#1b5e20;
    margin-bottom:10px;
}

.subtitle {
    text-align:center;
    font-size:13px;
    color:#6b7280;
    margin-bottom:30px;
}

/* Form */
.form-group { margin-bottom:20px; }

label {
    display:block;
    font-size:14px;
    font-weight:600;
    color:#374151;
    margin-bottom:8px;
}

input, textarea {
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid #dfe6ee;
    font-size:14px;
    transition:0.3s;
}

textarea {
    min-height:120px;
    resize:none;
}

input:focus, textarea:focus {
    outline:none;
    border-color:#d4af37;
    box-shadow:0 0 0 4px rgba(212,175,55,0.18);
}

/* Button */
button {
    width:100%;
    padding:15px;
    border-radius:14px;
    border:none;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(135deg,#d4af37,#f5d76e);
    transition:0.3s;
    box-shadow:0 15px 25px rgba(212,175,55,0.25);
}

button:hover {
    transform:translateY(-2px);
    box-shadow:0 20px 35px rgba(212,175,55,0.35);
}

/* Back link */
.back-link {
    display:block;
    text-align:center;
    margin-top:22px;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    color:#1b5e20;
}

.back-link:hover {
    text-decoration:underline;
}

@media(max-width:600px){
    .card { padding:35px; }
}
</style>
</head>

<body>

<div class="logo-corner">
    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Thavakalthu Farm">
</div>

<div class="card">
    <h2>Add Medical Record</h2>
    <div class="subtitle">
        Maintain accurate vaccination and treatment history for better herd management.
    </div>

    <form method="POST">

        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" required>
        </div>

        <div class="form-group">
            <label>Medical Details (Vaccine / Treatment / Notes)</label>
            <textarea name="description" required
            placeholder="Example: Vaccination done - PPR, dosage 2ml. Vet: Dr. Ahmed"></textarea>
        </div>

        <button type="submit">Save Record</button>

    </form>

    <a href="/goat/{{ goat_id }}" class="back-link">← Back to Goat Details</a>
</div>

</body>
</html>
