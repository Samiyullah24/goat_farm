<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Add Batch</title>
  <style>
    body{font-family:Arial;background:#f5f7fa;padding:25px}
    .card{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:14px;
          box-shadow:0 10px 22px rgba(0,0,0,.08)}
    h2{color:#166534;margin:0 0 12px 0}
    label{display:block;margin-top:12px;font-weight:800}
    input,textarea{width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:10px;margin-top:6px}
    button{margin-top:14px;background:#2e7d32;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:900;cursor:pointer}
    button:hover{background:#1b5e20}
    a{display:inline-block;margin-top:14px;color:#166534;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <div class="card">
    <h2>Add New Batch</h2>

    <form method="POST">
      <label>Batch Name</label>
      <input type="text" name="batch_name" placeholder="Batch 2" required>

      <label>Start Date</label>
      <input type="date" name="start_date">

      <label>Notes</label>
      <textarea name="notes" placeholder="April purchase..."></textarea>

      <button type="submit">Save Batch</button>
    </form>

    <a href="/dashboard">← Back to Dashboard</a>
  </div>
</body>
</html>
