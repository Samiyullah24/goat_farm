<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Weight - Thavakalthu Farm</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body{
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2f18, #2e7d32);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
}

/* Elegant floating logo */
.logo-corner{
    position: fixed;
    top: 30px;
    left: 30px;
    background: rgba(255,255,255,0.92);
    padding: 14px 18px;
    border-radius: 32px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.22), 0 10px 25px rgba(0,0,0,0.14);
    backdrop-filter: blur(10px);
    animation: floatLogo 6s ease-in-out infinite;
    z-index: 999;
}

@keyframes floatLogo {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

.logo-corner img{
    width: 140px;
    border-radius: 22px;
    display: block;
}

/* Card */
.card{
    width: 440px;
    max-width: 100%;
    background: white;
    padding: 50px;
    border-radius: 26px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.15), 0 12px 30px rgba(0,0,0,0.08);
}

.card h2{
    font-size: 26px;
    font-weight: 700;
    color: #2e7d32;
    text-align: center;
    margin-bottom: 12px;
}

.subtitle{
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 28px;
}

/* Form */
.form-group{ margin-bottom: 18px; }

label{
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #444;
}

input{
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #dfe6ee;
    font-size: 14px;
    transition: 0.3s;
}

input:focus{
    outline: none;
    border-color: #d4af37;
    box-shadow: 0 0 0 4px rgba(212,175,55,0.15);
}

/* Buttons */
.btn-primary{
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #d4af37, #f5d76e);
    transition: 0.3s;
    box-shadow: 0 15px 25px rgba(212,175,55,0.25);
    margin-top: 8px;
}

.btn-primary:hover{
    transform: translateY(-2px);
    box-shadow: 0 20px 35px rgba(212,175,55,0.35);
}

.back-link{
    display: block;
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
    text-decoration: none;
    color: #2e7d32;
    font-weight: 700;
}

.back-link:hover{ text-decoration: underline; }

/* Responsive */
@media(max-width: 600px){
    .card{ padding: 35px; }
    .logo-corner img{ width: 110px; }
}
</style>
</head>

<body>

<!-- Logo -->
<div class="logo-corner">
    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Thavakalthu Farm Logo">
</div>

<!-- Card -->
<div class="card">
    <h2>Edit Weight Record</h2>
    <div class="subtitle">Update the date and weight value accurately</div>

    <form method="POST">
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ date_value }}" required>
        </div>

        <div class="form-group">
            <label>Weight (kg)</label>
            <input type="number" step="0.01" name="weight" value="{{ weight_value }}" required>
        </div>

        <button class="btn-primary" type="submit">Update</button>
    </form>

    <a class="back-link" href="/goat/{{ goat_id }}">← Back</a>
</div>

</body>
</html>
