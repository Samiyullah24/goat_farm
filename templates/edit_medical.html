<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Medical Record - Thavakalthu Farm</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body{
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    background: linear-gradient(135deg, #0f2f18, #2e7d32);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

/* Elegant floating logo */
.logo-corner{
    position:fixed;
    top:28px;
    left:28px;
    background:rgba(255,255,255,0.95);
    padding:12px 16px;
    border-radius:28px;
    box-shadow:0 18px 40px rgba(0,0,0,0.25);
    backdrop-filter:blur(8px);
}

.logo-corner img{
    width:130px;
    border-radius:20px;
    display:block;
}

/* Card */
.card{
    width:540px;
    max-width:100%;
    background:#ffffff;
    padding:50px;
    border-radius:28px;
    box-shadow:
        0 35px 70px rgba(0,0,0,0.15),
        0 15px 35px rgba(0,0,0,0.08);
}

.card h2{
    font-size:28px;
    font-weight:700;
    text-align:center;
    color:#1b5e20;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    font-size:13px;
    color:#6b7280;
    margin-bottom:30px;
}

/* Form */
.form-group{
    margin-bottom:22px;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    color:#374151;
    margin-bottom:8px;
}

input, textarea{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid #dbe2ea;
    font-size:14px;
    transition:0.3s ease;
}

textarea{
    min-height:120px;
    resize:none;
}

input:focus, textarea:focus{
    outline:none;
    border-color:#d4af37;
    box-shadow:0 0 0 4px rgba(212,175,55,0.18);
}

/* Button */
.btn-primary{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:none;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(135deg,#d4af37,#f5d76e);
    transition:0.3s;
    box-shadow:0 15px 25px rgba(212,175,55,0.25);
}

.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 35px rgba(212,175,55,0.35);
}

/* Back link */
.back-link{
    display:block;
    text-align:center;
    margin-top:24px;
    font-size:14px;
    font-weight:600;
    color:#1b5e20;
    text-decoration:none;
}

.back-link:hover{
    text-decoration:underline;
}

@media(max-width:600px){
    .card{ padding:35px; }
}
</style>
</head>

<body>

<div class="logo-corner">
    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Thavakalthu Farm">
</div>

<div class="card">
    <h2>Edit Medical Record</h2>
    <div class="subtitle">
        Update vaccination, treatment, or medical notes accurately.
    </div>

    <form method="POST">
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ date_value }}" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" required>{{ desc_value }}</textarea>
        </div>

        <button type="submit" class="btn-primary">Save Changes</button>
    </form>

    <a href="/goat/{{ goat_id }}" class="back-link">← Back to Goat Details</a>
</div>

</body>
</html>
